      <stop offset="0" stop-color="#8d6c36"/><stop offset=".45" stop-color="#e2c68a"/><stop offset="1" stop-color="#8d6c36"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#fff4d6"/><stop offset=".5" stop-color="#f6d9a0" stop-opacity=".85"/><stop offset="1" stop-color="#e8b980" stop-opacity=".4"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="140" r="50" fill="url(#halo)"/>
  <path d="M50 0V58" stroke="#8d7550" stroke-width="1.4" stroke-dasharray="3 2"/>
