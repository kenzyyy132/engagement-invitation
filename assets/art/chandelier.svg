<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230">
  <!-- Venue motif: a gilded chandelier in fine line work. Hangs from (120, 0). -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0">
      <stop offset="0" stop-color="#a98545"/><stop offset=".5" stop-color="#e6cf98"/><stop offset="1" stop-color="#a98545"/>
    </linearGradient>
    <radialGradient id="flame" cx=".5" cy=".7" r=".6">
      <stop offset="0" stop-color="#fff6dc"/><stop offset=".6" stop-color="#f7c873"/><stop offset="1" stop-color="#ef9fb2" stop-opacity=".2"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0c8" stop-opacity=".7"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/>
    </radialGradient>
    <g id="candle">
      <ellipse cx="0" cy="-30" rx="11" ry="13" fill="url(#glow)"/>
      <path d="M-6 0H6L4-5H-4Z" fill="url(#g)"/>
      <rect x="-2.6" y="-20" width="5.2" height="15" rx="1" fill="#f8f2e4" stroke="#d9c7a0" stroke-width=".5"/>
      <path class="flame" d="M0-30C-3-26-3-22 0-20.5C3-22 3-26 0-30Z" fill="url(#flame)"/>
    </g>
    <g id="drop"><path d="M0 0V6" stroke="#cdb48a" stroke-width=".6"/><path d="M0 6C-2.4 9-2.4 12 0 14C2.4 12 2.4 9 0 6Z" fill="#f4eee3" stroke="#c9b28a" stroke-width=".6"/></g>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-linecap="round">
    <path d="M120 0V58" stroke-width="1.6"/>
    <path d="M120 58C114 62 114 70 120 74C126 70 126 62 120 58Z" stroke-width="1.4" fill="#f6efe0"/>
    <path d="M120 74V150" stroke-width="2.6"/>
    <!-- lower arms -->
    <path d="M120 140C96 150 56 150 36 128C30 120 34 112 40 112" stroke-width="2.2"/>
    <path d="M120 140C144 150 184 150 204 128C210 120 206 112 200 112" stroke-width="2.2"/>
    <path d="M120 132C104 140 84 140 74 124" stroke-width="1.8"/>
    <path d="M120 132C136 140 156 140 166 124" stroke-width="1.8"/>
    <!-- upper arms -->
    <path d="M120 100C104 104 92 100 86 88" stroke-width="1.6"/>
    <path d="M120 100C136 104 148 100 154 88" stroke-width="1.6"/>
    <!-- swags -->
    <path d="M40 120Q80 168 120 156Q160 168 200 120" stroke-width=".9" stroke-dasharray="2 2.4"/>
    <path d="M74 128Q97 152 120 146Q143 152 166 128" stroke-width=".8" stroke-dasharray="2 2.4"/>
  </g>
  <path d="M120 150C110 160 110 176 120 184C130 176 130 160 120 150Z" fill="#f6efe0" stroke="url(#g)" stroke-width="1.4"/>
  <circle cx="120" cy="192" r="6" fill="#f4eee3" stroke="#c9b28a"/>
  <use href="#candle" transform="translate(40 112)"/>
  <use href="#candle" transform="translate(200 112)"/>
  <use href="#candle" transform="translate(74 124)"/>
  <use href="#candle" transform="translate(166 124)"/>
  <use href="#candle" transform="translate(86 88) scale(.85)"/>
  <use href="#candle" transform="translate(154 88) scale(.85)"/>
  <use href="#candle" transform="translate(120 74) scale(.9)"/>
  <g class="drops">
    <use href="#drop" transform="translate(60 146)"/><use href="#drop" transform="translate(80 154)"/><use href="#drop" transform="translate(100 156)"/>
    <use href="#drop" transform="translate(140 156)"/><use href="#drop" transform="translate(160 154)"/><use href="#drop" transform="translate(180 146)"/>
    <use href="#drop" transform="translate(120 198) scale(1.3)"/>
  </g>
</svg>
